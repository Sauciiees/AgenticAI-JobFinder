# Render Blueprint for the public demo API (free tier).
# In Render: New > Blueprint > pick this repo. It asks for two values: DATABASE_URL and GOOGLE_API_KEY.
# See docs/DEPLOY.md. Optional extras (Turnstile, Sentry, R2) are added later in the
# dashboard under Environment.
services:
  - type: web
    name: jobfinder-api
    runtime: docker
    plan: free
    dockerfilePath: ./api.dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # The branch Render deploys from.
    branch: main
    # Deploy a commit only after its GitHub checks (CI) have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLE_BROWSER_AUTOMATION
        value: "false"
      # Neon pooled connection string (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Your Gemini key
      - key: GOOGLE_API_KEY
        sync: false
      # CVs are stored in the database (no separate storage account).
      # For a bucket instead: set s3 and add S3_BUCKET, S3_ENDPOINT_URL, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
      - key: STORAGE_BACKEND
        value: database
      - key: JWT_SECRET_KEY
        generateValue: true
      # Copy this value into the Cloudflare Pages project as PROXY_SHARED_SECRET.
      - key: PROXY_SHARED_SECRET
        generateValue: true
      # Used by the optional scheduled cleanup in GitHub Actions.
      - key: CLEANUP_SECRET
        generateValue: true
