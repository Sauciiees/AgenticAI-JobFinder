name: CI

on:
  push:
    branches: ["**"]  # every branch, so work is tested before any pull request
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests never call real services; these only satisfy startup checks.
  JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
  GOOGLE_API_KEY: ci-fake-google-key
  SERPER_API_KEY: ci-fake-serper-key

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt ruff==0.17.4 mypy==2.4.1 pytest==9.2.0
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Mypy
        run: mypy

  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobfinder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # The public API image doesn't include Playwright, so the tests don't either.
      - run: pip install -r requirements.txt pytest==9.2.0
      - name: Pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/jobfinder_test' || '' }}
        run: pytest -q
