name: Daily data cleanup

# Enforces retention on the public demo: guests after 24 hours, CVs and idle chats after 30 days.
# Needs two repository settings:
#   secrets.CLEANUP_SECRET   the CLEANUP_SECRET value from Render
#   vars.API_URL             the Render URL, e.g. https://jobfinder-api.onrender.com

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Call /internal/cleanup
        env:
          API_URL: ${{ vars.API_URL }}
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
        run: |
          # A sleeping free instance can take a minute to wake up, so allow retries.
          curl --fail-with-body --silent --show-error \
               --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
               -X POST -H "X-Cleanup-Secret: ${CLEANUP_SECRET}" \
               "${API_URL}/internal/cleanup"
